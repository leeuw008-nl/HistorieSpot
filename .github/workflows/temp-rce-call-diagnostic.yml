name: Temporary RCE call diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-rce-call:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add temporary RCE call diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '      loadRCEForPand(o);'
          new = '      if(window.rceFlowDebug) window.rceFlowDebug("FLOW → loadRCEForPand aanroep");\n      loadRCEForPand(o);'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 occurrence, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Add temporary RCE call diagnostic'
          git push