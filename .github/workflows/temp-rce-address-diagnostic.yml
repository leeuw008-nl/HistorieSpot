name: Temporary RCE address diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-rce-address:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add exact BAG response diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '''        const data=await res.json();
        const v=data && Array.isArray(data.features) && data.features.length
          ? (data.features[0].properties || {})
          : (data.properties || {});'''
          new = '''        const data=await res.json();
        if(window.rceFlowDebug) window.rceFlowDebug(
          "BAG RAW → " + JSON.stringify(data)
        );
        const v=data && Array.isArray(data.features) && data.features.length
          ? (data.features[0].properties || {})
          : (data.properties || {});'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 BAG response parser block, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Show exact BAG response for RCE diagnostic'
          git push

# trigger
