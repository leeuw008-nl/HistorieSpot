name: Restore known working app.js
on:
  push:
    branches: [main]
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[skip restore]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore app.js
        run: |
          git checkout 94d50725c8bd46ef73b3ff1dd2bff0f3a0750afc3 -- app.js
      - name: Commit restored app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore working map click and 1832 functionality [skip restore]"
          git push
