name: Patch RCE diagnose isolation
on:
  push:
    paths:
      - .github/workflows/patch-rce-diagnose.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('  }\n).addTo(map);\n\nminuutLayer.addTo(map);', '  }\n);')
          s = s.replace('async function loadHistForLocation(lat,lng){\n\n  try{', 'async function loadHistForLocation(lat,lng){\n\n  /* Tijdelijk uitgeschakeld tijdens BAG-RCE diagnose: RCE WFS/WMS time-out. */\n  return;\n\n  try{')
          s = s.replace('    setStatus(\n      `${list.length} BAG binnen ${radius}m`\n    );', '    /* RCE-diagnose mag door deze eindmelding niet worden overschreven. */\n    if(!window.rceDiagnosisShown)\n      setStatus(`${list.length} BAG binnen ${radius}m`);')
          s = s.replace('    setStatus(\n      `RCE-diagnose: BAG verblijfsobject → ${adresDiagnose} → ${monuments.length} RCE-resultaat/resultaten`\n    );', '    window.rceDiagnosisShown=true;\n    setStatus(\n      `RCE-diagnose: BAG verblijfsobject → ${adresDiagnose} → ${monuments.length} RCE-resultaat/resultaten`\n    );')
          if s == old:
              raise SystemExit('Geen wijziging gevonden; patch afgebroken')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Isolate BAG-RCE diagnose from RCE minuteplan service"
          git push
