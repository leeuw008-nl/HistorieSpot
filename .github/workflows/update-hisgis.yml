name: Update HisGIS Ommen 1832

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download Ommen 1832
        run: |
          mkdir -p data
          echo "Proberen HisGIS te downloaden..."
          curl -L --fail -o data/ommen-1832.geojson "https://hisgis.nl/geoserver/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAME=overijssel:percelen_1832&OUTPUTFORMAT=application/json&CQL_FILTER=kadastrale_gemeente%20IN%20('Ommen','Ambt%20Ommen','Stad%20Ommen')&SRSNAME=EPSG:4326" || echo '{"type":"FeatureCollection","features":[]}' > data/ommen-1832.geojson
          ls -lh data/ommen-1832.geojson

      - name: Commit
        run: |
          git config user.name "HisGIS bot"
          git config user.email "bot@historiespot.nl"
          git add data/ommen-1832.geojson || true
          git diff --staged --quiet || git commit -m "Update Ommen 1832 percelen van HisGIS"
          git push
