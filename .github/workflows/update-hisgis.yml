name: Update HisGIS Ommen 1832

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Ommen 1832
        run: |
          mkdir -p data
          curl -L -o data/ommen-1832.geojson "https://hisgis.nl/geoserver/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAME=overijssel:percelen_1832&OUTPUTFORMAT=application/json&CQL_FILTER=kadastrale_gemeente%20IN%20('Ommen','Ambt%20Ommen','Stad%20Ommen')&SRSNAME=EPSG:4326"
          ls -lh data/ommen-1832.geojson
      - name: Commit
        run: |
          git config user.name "HisGIS bot"
          git config user.email "bot@historiespot.nl"
          git add data/ommen-1832.geojson
          git diff --staged --quiet || git commit -m "Update Ommen 1832 percelen van HisGIS"
          git push
