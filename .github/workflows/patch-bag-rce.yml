name: Patch BAG RCE only
on:
  push:
    paths:
      - '.github/workflows/patch-bag-rce.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch BAG RCE logic only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('app.js')
          s=path.read_text()

          old=re.search(r'async function getBAGAddresses\(p\)\{.*?\n\}\n\n\n/\* =========================================================\n   RCE FUNCTIE 2', s, re.S)
          if not old:
              raise SystemExit('getBAGAddresses block not found')

          new='''async function getBAGAddresses(p){

            const results=[];

            if(p && Array.isArray(p.verblijfsobject)){
              const hrefs=p.verblijfsobject
                .map(v=>v && (v.href || v))
                .filter(Boolean);

              for(const href of hrefs){
                try{
                  const res=await fetch(href);
                  if(!res.ok) continue;
                  const data=await res.json();

                  const v=
                    data && Array.isArray(data.features) && data.features.length
                      ? (data.features[0].properties || {})
                      : (data.properties || {});

                  if(!v.openbare_ruimte_naam || !v.huisnummer || !v.woonplaats_naam)
                    continue;

                  results.push({
                    straat:v.openbare_ruimte_naam,
                    huisnummer:v.huisnummer,
                    huisletter:v.huisletter || '',
                    toevoeging:v.toevoeging || '',
                    postcode:v.postcode || '',
                    woonplaats:v.woonplaats_naam
                  });
                }catch(e){
                  console.error('BAG verblijfsobject fout:',href,e);
                }
              }
            }

            if(results.length)
              return results;

            return [];
          }


/* =========================================================
   RCE FUNCTIE 2'''

          s=s[:old.start()]+new+s[old.end():]

          marker='async function loadBAG(lat,lng,radius){\n\n'
          if marker not in s:
              raise SystemExit('loadBAG marker not found')
          s=s.replace(marker, marker+'  window.rceDiagnosisShown=false;\n\n', 1)

          old_status='''    setStatus(
      `${list.length} BAG binnen ${radius}m`
    );'''
          new_status='''    if(!window.rceDiagnosisShown)
      setStatus(`${list.length} BAG binnen ${radius}m`);'''
          if old_status not in s:
              raise SystemExit('BAG status block not found')
          s=s.replace(old_status,new_status,1)

          path.write_text(s)
          PY

          git diff -- app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix BAG to RCE address matching'
          git push
