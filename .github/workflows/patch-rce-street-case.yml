name: Patch RCE address diagnostics

on:
  push:
    paths:
      - ".github/workflows/patch-rce-street-case.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app.js")
          s=p.read_text(encoding="utf-8")
          old='''      const adresMatch=\n        straatMatch &&\n        huisnummerMatch &&\n        postcodeMatch;'''
          new='''      const adresMatch=\n        straatMatch &&\n        huisnummerMatch &&\n        postcodeMatch;\n\n      /* TIJDELIJKE DIAGNOSE: RCE adresvergelijking */\n      if(window.rceFlowDebug)\n        window.rceFlowDebug(\n          `ADRES-CHECK | BAG: ${straat} ${huisnummer} ${postcode || "geen postcode"} | RCE: ${rceStraat} ${rceHuisnummer} ${rcePostcode || "geen postcode"} | straat:${straatMatch ? "JA" : "NEE"} huisnummer:${huisnummerMatch ? "JA" : "NEE"} postcode:${postcodeMatch ? "JA" : "NEE"}`\n        );'''
          if "/* TIJDELIJKE DIAGNOSE: RCE adresvergelijking */" in s:
              print("Diagnostic already applied")
          else:
              if old not in s:
                  raise SystemExit("Expected adresMatch block not found")
              s=s.replace(old,new,1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm .github/workflows/patch-rce-street-case.yml
          git commit -m "Add RCE address comparison diagnostics"
          git push
