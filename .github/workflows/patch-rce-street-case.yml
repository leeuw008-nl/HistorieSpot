name: Patch RCE street case

on:
  push:
    paths:
      - ".github/workflows/patch-rce-street-case.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text(encoding="utf-8")
          old = '''    const straat=String(address.straat || "").trim();'''
          new = '''    const straat=String(address.straat || "").trim();
    const rceStraat=
      straat ? straat.charAt(0).toUpperCase()+straat.slice(1) : "";'''
          if old not in s:
              raise SystemExit("Expected street declaration not found")
          if "encodeURIComponent(rceStraat)" in s:
              raise SystemExit("Patch already applied")
          s = s.replace(old, new, 1)
          old_url = '''      "page=1&pageSize=10&straat=" +
      encodeURIComponent(straat);'''
          new_url = '''      "page=1&pageSize=10&straat=" +
      encodeURIComponent(rceStraat);'''
          if old_url not in s:
              raise SystemExit("Expected RCE URL block not found")
          s = s.replace(old_url, new_url, 1)
          p.write_text(s, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Normalize RCE street query capitalization"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/patch-rce-street-case.yml
          git commit -m "Remove temporary RCE patch workflow"
          git push

# trigger patch run
