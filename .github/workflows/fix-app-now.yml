name: Fix app now
on: push
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout 11ba87003bf83c898a6d47639302e8540c8db5eb -- app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='    setStatus(diagnose);'
          new='    setStatus(`RCE URL: ${url} | ${diagnose}`);'
          assert old in s, 'setStatus(diagnose) not found'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Restore app.js and show full RCE URL'
          git push
