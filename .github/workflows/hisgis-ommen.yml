name: HisGIS Ommen 1832 - structureel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Ontdek en download Ommen
        run: |
          mkdir -p data
          python << 'PY'
          import requests, json, re

          base = "https://geoserver.hisgis.nl/geoserver/overijssel/ows"
          headers = {"User-Agent":"HistorieSpot/1.0"}

          # 1. Vraag op welke lagen er bestaan
          print("GetCapabilities opvragen...")
          caps = requests.get(base, params={"SERVICE":"WFS","REQUEST":"GetCapabilities"}, headers=headers, timeout=30)
          print(caps.text[:2000]) # eerste 2000 tekens om laagnaam te vinden

          # Zoek naar percelen 1832 lagen
          candidates = re.findall(r"<Name>([^<]*perce[^<]*1832[^<]*)</Name>", caps.text, re.IGNORECASE)
          if not candidates:
              candidates = re.findall(r"<Name>([^<]*1832[^<]*)</Name>", caps.text, re.IGNORECASE)
          print(f"Kandidaten: {candidates}")

          # Probeer de meest waarschijnlijke
          typename = candidates[0] if candidates else "overijssel:percelen_1832"
          print(f"Probeer typename: {typename}")

          params = {
            "SERVICE": "WFS",
            "VERSION": "1.0.0",
            "REQUEST": "GetFeature",
            "TYPENAME": typename,
            "OUTPUTFORMAT": "application/json",
            "SRSNAME": "EPSG:4326",
            "BBOX": "6.39,52.48,6.48,52.56"
          }
          r = requests.get(base, params=params, headers=headers, timeout=120)
          print(f"WFS Status: {r.status_code}")
          if r.status_code!= 200:
              print(f"Response: {r.text[:1000]}")
              r.raise_for_status()

          data = r.json()
          print(f"Features binnen BBOX: {len(data.get('features',[]))}")

          # Als 0, probeer zonder BBOX filter gewoon 100 features
          if len(data.get('features',[])) == 0:
              print("0 features met BBOX, probeer zonder BBOX (eerste 500)...")
              params.pop("BBOX")
              params["MAXFEATURES"] = "500"
              r = requests.get(base, params=params, headers=headers, timeout=120)
              data = r.json()
              print(f"Features zonder BBOX: {len(data.get('features',[]))}")

          with open('data/ommen-1832.geojson','w',encoding='utf-8') as out:
              json.dump(data, out)
          print("Opgeslagen")
          PY
          ls -lh data/

      - name: Commit
        run: |
          git config user.name "HistorieSpot bot"
          git config user.email "actions@github.com"
          git add data/ommen-1832.geojson
          git diff --staged --quiet || git commit -m "HisGIS Ommen auto-update met echte laagnaam"
          git push
