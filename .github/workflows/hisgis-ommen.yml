name: HisGIS Ommen 1832 - structureel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Download Ommen via BBOX
        run: |
          mkdir -p data
          python << 'PY'
          import requests, json
          # BBOX om Ommen centrum + buitengebied: min_lon, min_lat, max_lon, max_lat
          # Ommen: 6.40 - 6.47, 52.48 - 52.55
          params = {
            "SERVICE": "WFS",
            "VERSION": "2.0.0",
            "REQUEST": "GetFeature",
            "TYPENAME": "overijssel:percelen_1832",
            "OUTPUTFORMAT": "application/json",
            "SRSNAME": "EPSG:4326",
            "BBOX": "6.39,52.48,6.48,52.56,EPSG:4326",
            "COUNT": "10000"
          }
          url = "https://geoserver.hisgis.nl/geoserver/overijssel/ows"
          print(f"Fetching {url} with BBOX")
          r = requests.get(url, params=params, headers={"User-Agent":"HistorieSpot/1.0"}, timeout=120)
          print(f"Status {r.status_code}, size {len(r.text)}")
          r.raise_for_status()
          data = r.json()
          print(f"Features: {len(data.get('features',[]))}")
          # Opschonen
          for f in data.get('features',[]):
              p=f.get('properties',{})
              f['properties']={
                'sectie': p.get('sectie') or p.get('SECTIE') or p.get('section') or '',
                'perceelnummer': p.get('perceelnummer') or p.get('perceel') or p.get('PERCEELNR') or str(p.get('perceelnr','')),
                'eigenaar': p.get('eigenaar') or p.get('eigenaar_1832') or p.get('EIGENAAR') or '',
                'beroep': p.get('beroep') or '',
                'gebruik': p.get('gebruik') or p.get('grondgebruik') or p.get('GEBRUIK') or '',
              }
          with open('data/ommen-1832.geojson','w',encoding='utf-8') as out:
              json.dump(data,out)
          PY
          ls -lh data/ommen-1832.geojson
          wc -l data/ommen-1832.geojson

      - name: Commit
        run: |
          git config user.name "HistorieSpot bot"
          git config user.email "actions@github.com"
          git add data/ommen-1832.geojson
          git diff --staged --quiet || git commit -m "HisGIS Ommen 1832 BBOX update"
          git push
