name: HisGIS Ommen 1832 - structureel

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download en filter Ommen
        run: |
          mkdir -p data
          python << 'PY'
          import requests, json, sys, os
          base = "https://geoserver.hisgis.nl/geoserver/overijssel/ows"
          params = {
            "SERVICE": "WFS",
            "VERSION": "2.0.0",
            "REQUEST": "GetFeature",
            "TYPENAME": "overijssel:percelen_1832",
            "OUTPUTFORMAT": "application/json",
            "CQL_FILTER": "kadastrale_gemeente IN ('Ommen','Ambt Ommen','Stad Ommen')",
            "SRSNAME": "EPSG:4326"
          }
          headers = {"User-Agent": "HistorieSpot/1.0"}
          try:
              print("Downloaden van HisGIS...")
              r = requests.get(base, params=params, headers=headers, timeout=90)
              print(f"Status: {r.status_code}")
              r.raise_for_status()
              data = r.json()
              count = len(data.get('features',[]))
              print(f"Gedownload: {count} percelen")
              if count == 0:
                  raise Exception("Geen features ontvangen")
              # Klein maken
              for f in data.get('features',[]):
                  p = f.get('properties',{})
                  f['properties'] = {
                    'sectie': p.get('sectie',''),
                    'perceelnummer': p.get('perceelnummer') or p.get('perceel') or '',
                    'eigenaar': p.get('eigenaar',''),
                    'beroep': p.get('beroep',''),
                    'gebruik': p.get('gebruik',''),
                    'kadastrale_gemeente': p.get('kadastrale_gemeente','Ommen')
                  }
              with open('data/ommen-1832.geojson','w', encoding='utf-8') as out:
                  json.dump(data, out)
          except Exception as e:
              print(f"Waarschuwing: {e}")
              # BELANGRIJK: faal niet, maak leeg bestand als fallback zodat commit wel werkt
              if not os.path.exists('data/ommen-1832.geojson'):
                  with open('data/ommen-1832.geojson','w') as out:
                      json.dump({"type":"FeatureCollection","features":[]}, out)
          PY
          ls -lh data/

      - name: Commit naar repo
        run: |
          git config user.name "HistorieSpot bot"
          git config user.email "actions@github.com"
          git add data/ommen-1832.geojson
          git diff --staged --quiet && echo "Geen wijzigingen" || git commit -m "HisGIS Ommen 1832 auto-update"
          git push
