name: HisGIS Ommen 1832 - structureel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check of data al bestaat
        run: |
          mkdir -p data
          if [ -f data/ommen-1832.geojson ]; then
            echo "Bestaand bestand gevonden, grootte:"
            ls -lh data/ommen-1832.geojson
          else
            echo "Geen bestand, maak dummy aan"
            echo '{"type":"FeatureCollection","features":[]}' > data/ommen-1832.geojson
          fi

      - name: Probeer HisGIS (maar faal nooit)
        continue-on-error: true
        run: |
          python3 << 'PY'
          import urllib.request, json
          url = "https://geoserver.hisgis.nl/geoserver/overijssel/ows?SERVICE=WFS&VERSION=1.0.0&REQUEST=GetFeature&TYPENAME=overijssel:hisgis_overijssel_percelen_1832&OUTPUTFORMAT=application/json&BBOX=6.39,52.48,6.48,52.56&MAXFEATURES=2000"
          try:
              print(f"Proberen: {url}")
              req = urllib.request.Request(url, headers={"User-Agent":"HistorieSpot"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
                  print(f"Gevonden: {len(data.get('features',[]))} percelen")
                  if len(data.get('features',[])) > 10:
                      with open('data/ommen-1832.geojson','w') as f:
                          json.dump(data,f)
                      print("Opgeslagen!")
          except Exception as e:
              print(f"HisGIS tijdelijk offline: {e} -> behoud oude data")
          PY

      - name: Commit als er nieuwe data is
        run: |
          git config user.name "HistorieSpot bot"
          git config user.email "actions@github.com"
          git add data/ommen-1832.geojson || true
          git diff --staged --quiet || git commit -m "HisGIS check"
          git push || echo "niks te pushen"
