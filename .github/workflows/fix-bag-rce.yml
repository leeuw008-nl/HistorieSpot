name: Fix BAG RCE address lookup
on:
  push:
    paths:
      - '.github/workflows/fix-bag-rce.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good app.js and patch BAG/RCE only
        run: |
          git checkout a60892a6f0eff6cd39553986e93902ee465341d3 -- app.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          start=s.index('async function getBAGAddresses(p){')
          end=s.index('\n\n\n/* =========================================================\n   RCE FUNCTIE 2', start)
          fn='''async function getBAGAddresses(p,o){
            const results=[];
            if(p && Array.isArray(p.verblijfsobject)){
              const hrefs=p.verblijfsobject.map(v=>v && (v.href || v)).filter(Boolean);
              for(const href of hrefs){
                try{
                  const res=await fetch(href);
                  if(!res.ok) continue;
                  const data=await res.json();
                  const v=data && Array.isArray(data.features) && data.features.length ? (data.features[0].properties || {}) : (data.properties || {});
                  if(!v.openbare_ruimte_naam || !v.huisnummer || !v.woonplaats_naam) continue;
                  results.push({straat:v.openbare_ruimte_naam,huisnummer:v.huisnummer,huisletter:v.huisletter || '',toevoeging:v.toevoeging || '',postcode:v.postcode || '',woonplaats:v.woonplaats_naam});
                }catch(e){ console.error('BAG verblijfsobject fout:',href,e); }
              }
            }
            if(results.length) return results;
            if(!p || !p.identificatie || !o || !o.c) return [];
            try{
              const b=box(o.c.lat,o.c.lng,50);
              const url=`https://api.pdok.nl/kadaster/bag/ogc/v2/collections/verblijfsobject/items?bbox=${b.minLo},${b.minLa},${b.maxLo},${b.maxLa}&limit=100&f=json`;
              const res=await fetch(url);
              if(!res.ok) return [];
              const data=await res.json();
              const features=Array.isArray(data.features) ? data.features : [];
              for(const f of features){
                const v=f.properties || {};
                const rel=v.pand;
                const hrefs=[];
                if(Array.isArray(rel)) rel.forEach(r=>{if(typeof r==='string') hrefs.push(r); else if(r && r.href) hrefs.push(r.href);});
                else if(typeof rel==='string') hrefs.push(rel);
                else if(rel && rel.href) hrefs.push(rel.href);
                if(!hrefs.some(h=>String(h).includes(String(p.identificatie)))) continue;
                if(!v.openbare_ruimte_naam || !v.huisnummer || !v.woonplaats_naam) continue;
                results.push({straat:v.openbare_ruimte_naam,huisnummer:v.huisnummer,huisletter:v.huisletter || '',toevoeging:v.toevoeging || '',postcode:v.postcode || '',woonplaats:v.woonplaats_naam});
              }
            }catch(e){ console.error('BAG VO zoekfout:',e); }
            return results;
          }'''
          s=s[:start]+fn+s[end:]
          s=s.replace('await getBAGAddresses(p);','await getBAGAddresses(p,o);',1)
          s=s.replace('async function loadBAG(lat,lng,radius){\n\n','async function loadBAG(lat,lng,radius){\n\n  window.rceDiagnosisShown=false;\n\n',1)
          s=s.replace('if(!addresses.length){\n    setStatus("RCE-diagnose: BAG-pand heeft geen bruikbaar verblijfsobject-adres");\n    return;\n  }','if(!addresses.length){\n    return;\n  }',1)
          s=s.replace('for(const address of addresses){\n\n    const monuments=','for(const address of addresses){\n\n    window.rceDiagnosisShown=true;\n\n    const monuments=',1)
          s=s.replace('    setStatus(\n      `${list.length} BAG binnen ${radius}m`\n    );','    if(!window.rceDiagnosisShown)\n      setStatus(`${list.length} BAG binnen ${radius}m`);',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix BAG to RCE address lookup'
          git push
