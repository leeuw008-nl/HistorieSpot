<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HistorieSpot</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><link rel="stylesheet" href="style.css"></head><body>
<header class="app-header"><button id="menuBtn" class="icon-btn">☰</button><div class="header-title"><h1>HistorieSpot</h1></div><button id="infoBtn" class="icon-btn">ℹ</button></header>
<div id="menuOverlay" class="overlay hidden"></div><nav id="sideMenu" class="side-menu"><div class="side-menu-header"><strong>Menu</strong><button id="closeMenuBtn" class="icon-btn small">✕</button></div><div class="side-menu-content"><div class="menu-section"><h3>Zoeken</h3><select id="radius"><option value="25">25m</option><option value="50" selected>50m</option><option value="100">100m</option><option value="250">250m</option><option value="500">500m</option></select></div><div class="menu-section"><h3>Kaartlagen</h3><label class="toggle"><input type="checkbox" id="toggleMinuutplan" checked> Minuutplan 1811-1832</label><br><label class="toggle"><input type="checkbox" id="toggleBAG" checked> BAG</label><br><label class="toggle"><input type="checkbox" id="toggleMIP" checked> Monumenten</label></div></div></nav>
<div id="infoOverlay" class="overlay hidden"></div><div id="infoModal" class="modal hidden"><div class="modal-header"><h2>Over</h2><button id="closeInfoBtn" class="icon-btn small">✕</button></div><div class="modal-body"><p>HistorieSpot toont BAG + monumenten + minuutplan 1811-1832. B02↔B03 gecorrigeerd.</p></div></div>
<main class="main-fullscreen"><div id="map"></div><button id="locateBtn" class="locate-fab">◎</button><div id="opacityBar" class="map-bottom-bar"><input id="historischeOpacity" type="range" min="0" max="100" value="55"><span id="historischeOpacityValue" class="value">55%</span><div class="bar-divider"></div><button id="toggleBAGBtn" class="bag-toggle-btn active">BAG</button><button id="toggleMIPBtn" class="bag-toggle-btn active">MIP</button></div><div id="status" class="status-toast">Druk kompas voor locatie. Klik kaart voor minuutplan.</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script>
</body></html>
